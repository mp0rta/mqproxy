[workspace]
resolver = "2"
members = [
  "crates/xquic-sys", "crates/mq-linux", "crates/mq-wire", "crates/mq-http", "crates/mq-wire-difftest",
  "crates/mq-transport-api", "crates/mq-transport", "crates/mq-runtime",
  "crates/mq-proxy", "crates/mqproxy", "crates/mq-integration",
]
exclude = ["crates/mq-wire/fuzz", "crates/mq-proxy/fuzz", "crates/mq-http/fuzz"]   # cargo-fuzz crates are their own workspaces

[workspace.package]
version = "0.0.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
libc = "0.2"
mio = { version = "1", features = ["os-poll", "os-ext", "net"] }
tokio = { version = "1", default-features = false, features = ["rt", "sync", "net", "macros"] }
signal-hook = "0.3"
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
subtle = "2"
proptest = "1"
static_assertions = "1"
cmake = "0.1"
cc = "1"
# SP3 spec §8: the origin bridge (hyper polled from the shard).
hyper = { version = "~1.10", default-features = false, features = ["client", "http1", "http2", "server"] }
# Not used directly: a manifest floor under hyper's h2 so the RUSTSEC-2026-0258
# fix (0.4.19) is an invariant, not just the lockfile (spec §13 says 0.4.14).
h2 = "0.4.19"
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-native-certs = "0.8"
# SP4 spec §7.1/§7.2: the MITM CA (load + checks) and leaf forging.
rcgen = { version = "=0.14.9", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
x509-parser = "0.18"
rustls-webpki = "0.103"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
