name: Performance Tests

# Security: only push to main and manual trigger.
# Never runs on PRs — prevents fork code execution on GitHub-hosted runner.
# Runner requires --privileged (netns mount + tc/netem/nft) — runs in ubuntu:24.04 container.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mqproxy-perf-commit
  cancel-in-progress: true

jobs:
  perf-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:24.04  # must match every job sharing the xquic cache key (glibc ABI)
      options: --privileged
    steps:
      - name: Install git (needed before checkout for submodules)
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          apt-get install -y \
            cmake gcc g++ make \
            golang \
            iproute2 nftables curl python3 openssl sudo \
            iperf3 socat \
            python3-pip pipx \
            ca-certificates
          pipx install awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        run: |
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build mqproxy (Rust Release)
        run: cargo build --release --locked -p mqproxy

      - name: TCP proxy benchmark
        run: sudo bash scripts/ci_benchmarks/ci_bench_tcp_proxy.sh target/release/mqproxy

      - name: MITM H2 benchmark
        run: sudo bash scripts/ci_benchmarks/ci_bench_mitm.sh target/release/mqproxy

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results-${{ github.sha }}
          path: ci_bench_results/*.json
          retention-days: 90

      - name: Verify aws-cli is installed
        if: success()
        run: aws --version

      - name: Publish results to R2
        if: success()
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: bash scripts/ci_publish/publish_to_r2.sh mqproxy/perf-data push

      - name: Post-job cleanup
        if: always()
        run: rm -rf ci_bench_results
