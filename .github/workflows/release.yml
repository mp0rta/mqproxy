name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    uses: ./.github/workflows/ci.yml

  publish-release:
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          shopt -s nullglob
          sha256sum mqproxy_*.deb mqproxy_*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACTS=(artifacts/mqproxy_*.deb artifacts/mqproxy_*.tar.gz)
          PRERELEASE_FLAG=""
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "mqproxy v${VERSION}" \
            --notes "" \
            $PRERELEASE_FLAG \
            "${ARTIFACTS[@]}" \
            artifacts/SHA256SUMS \
            LICENSE
