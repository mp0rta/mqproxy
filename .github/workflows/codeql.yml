name: CodeQL

on:
  # Scoped to the default branch: CodeQL runs build scripts and uploads to the
  # repo code-scanning store, so run it on main pushes + PRs targeting main +
  # weekly, not on every feature-branch push. (The lightweight fuzz job in
  # rust.yml still runs on all branches.)
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1'   # weekly, Monday 04:23 UTC
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      security-events: write
      contents: read
      actions: read   # CodeQL status-report/telemetry calls the workflow-runs API
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake golang
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: rust
          build-mode: none
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:rust
