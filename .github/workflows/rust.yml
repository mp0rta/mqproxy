name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: cargo test --workspace

  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --workspace --target ${{ matrix.target }}

  fuzz-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Replay the C corpora
        run: |
          for pair in varint:varint auth_req:wire_auth_req auth_resp:wire_auth_resp connect_tcp_req:wire_connect_tcp_req connect_tcp_resp:wire_connect_tcp_resp; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p crates/mq-wire/fuzz/corpus/$t
            cargo +nightly fuzz run --fuzz-dir crates/mq-wire/fuzz $t crates/mq-wire/fuzz/corpus/$t fuzz/corpus/$c -- -runs=0
          done

  fuzz-explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Explore 30 s per target
        run: |
          for pair in varint:varint auth_req:wire_auth_req auth_resp:wire_auth_resp connect_tcp_req:wire_connect_tcp_req connect_tcp_resp:wire_connect_tcp_resp; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p crates/mq-wire/fuzz/corpus/$t
            cargo +nightly fuzz run --fuzz-dir crates/mq-wire/fuzz $t crates/mq-wire/fuzz/corpus/$t fuzz/corpus/$c -- -max_total_time=30
          done

  bindings-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libclang-18-dev
      - run: cargo install bindgen-cli --version 0.72.1 --locked
      - run: ./scripts/update-xquic-bindings.sh
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
      - run: git diff --exit-code crates/xquic-sys/src/bindings.rs
