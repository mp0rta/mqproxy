name: Rust

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 0'   # Sunday 04:00 UTC: the weekly unshaped + idle run (perf-rust)

jobs:
  fmt-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: cargo test --workspace --locked
      - run: cargo test -p mqproxy --examples --locked

  build-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: cross build --workspace --target ${{ matrix.target }}
      # a library build never links: run the layout + engine tests (qemu for aarch64)
      - run: cross test -p xquic-sys --target ${{ matrix.target }}
      # x86_64 musl runs the whole suite (spec §10: tests on x86_64 glibc and musl)
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cross test --workspace --target ${{ matrix.target }}

  fuzz-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Replay the C corpora
        run: |
          for pair in varint:varint auth_req:wire_auth_req auth_resp:wire_auth_resp connect_tcp_req:wire_connect_tcp_req connect_tcp_resp:wire_connect_tcp_resp udp_session_open:wire_udp_session_open udp_session_resp:wire_udp_session_resp udp_msg_hdr:udp_msg_hdr; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-wire/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-wire/fuzz "$t" "crates/mq-wire/fuzz/corpus/$t" "fuzz/corpus/$c" -- -runs=0
          done
          for pair in socks5:socks5_feed http_connect:http_connect socks5_udp_hdr:socks5_udp_hdr; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-proxy/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-proxy/fuzz "$t" "crates/mq-proxy/fuzz/corpus/$t" "fuzz/corpus/$c" -- -runs=0
          done
          for pair in h1_head:mq_http_h1_head parse_target:mq_http_parse_target format_req:mq_http_format_req; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-http/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-http/fuzz "$t" "crates/mq-http/fuzz/corpus/$t" "fuzz/corpus/$c" -- -runs=0
          done

  fuzz-explore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: rustup toolchain install nightly --profile minimal
      - run: cargo install cargo-fuzz --locked
      - name: Explore 30 s per target
        run: |
          for pair in varint:varint auth_req:wire_auth_req auth_resp:wire_auth_resp connect_tcp_req:wire_connect_tcp_req connect_tcp_resp:wire_connect_tcp_resp udp_session_open:wire_udp_session_open udp_session_resp:wire_udp_session_resp udp_msg_hdr:udp_msg_hdr; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-wire/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-wire/fuzz "$t" "crates/mq-wire/fuzz/corpus/$t" "fuzz/corpus/$c" -- -max_total_time=30
          done
          for pair in socks5:socks5_feed http_connect:http_connect socks5_udp_hdr:socks5_udp_hdr; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-proxy/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-proxy/fuzz "$t" "crates/mq-proxy/fuzz/corpus/$t" "fuzz/corpus/$c" -- -max_total_time=30
          done
          for pair in h1_head:mq_http_h1_head parse_target:mq_http_parse_target format_req:mq_http_format_req; do
            t=${pair%%:*}; c=${pair##*:}
            mkdir -p "crates/mq-http/fuzz/corpus/$t"
            cargo +nightly fuzz run --fuzz-dir crates/mq-http/fuzz "$t" "crates/mq-http/fuzz/corpus/$t" "fuzz/corpus/$c" -- -max_total_time=30
          done

  bindings-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libclang-18-dev
      - run: cargo install bindgen-cli --version 0.72.1 --locked
      - run: ./scripts/update-xquic-bindings.sh
        env:
          LIBCLANG_PATH: /usr/lib/llvm-18/lib
      - run: git diff --exit-code crates/xquic-sys/src/bindings.rs

  asan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - run: rustup toolchain install nightly --profile minimal --component rust-src
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: scripts/rust-asan.sh

  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  xquic-fork-tests:
    # The fork's own CUnit suite (spec §9.2 "fork unit tests pass"); validate.sh
    # generates the TLS fixtures (ensure_test_certificate) and runs ctest.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # libevent-dev: the fork's tests/CMakeLists.txt requires LibEvent >= 2.0.21
      # even for the CUnit suite (validate.sh test).
      - run: sudo apt-get update && sudo apt-get install -y libcunit1-dev libevent-dev openssl
      - run: scripts/build-xquic.sh
      - run: cd third_party/xquic && scripts/validate.sh test

  e2e:
    # Rust black-box gates. A skip (exit 77) fails the step.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ubuntu:24.04
      options: --cap-add=NET_ADMIN
    env:
      # e2e_gateway: no tc on lo (cases 8 and 10) is a failure here, not a skip.
      MQPROXY_E2E_REQUIRE_NETADMIN: 1
    steps:
      - name: Install git (needed before checkout for submodules)
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          apt-get install -y \
            cmake gcc g++ make \
            golang \
            iproute2 nftables curl python3 openssl sudo \
            iperf3 socat procps ca-certificates
      - name: Install Rust (rust-toolchain.toml picks the version)
        run: |
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p mqproxy --bins --examples
      - name: Generate MITM test certificates
        run: bash tests/certs/generate-mitm.sh
      - name: Rust end-to-end gates
        env:
          MQPROXY_BIN: ${{ github.workspace }}/target/release/mqproxy
          UDPSOCKS_BIN: ${{ github.workspace }}/target/release/examples/udpsocks
          UDPECHO_BIN: ${{ github.workspace }}/target/release/examples/udp_echo
        run: |
          bash tests/test_cli_help.sh "$MQPROXY_BIN"
          for test in multipath tproxy path_recovery udp gateway mitm_smoke mitm_h2; do
            bash "tests/integration/e2e_${test}.sh"
          done
      - name: Upload e2e logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rust-e2e-logs
          path: /tmp/mqproxy_e2e_*
          if-no-files-found: ignore

  perf-rust:
    # The Rust binary in the perf job, under perf.yml's rules (privileged
    # container, never on PRs). Push to main: ci_bench_tcp_proxy.sh, informational.
    # Weekly schedule / manual: Rust unshaped, idle, gateway and MITM benchmarks.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ubuntu:24.04
      options: --privileged
    steps:
      - name: Install git (needed before checkout for submodules)
        run: apt-get update && apt-get install -y git
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          apt-get install -y \
            cmake gcc g++ make \
            golang \
            iproute2 nftables curl python3 openssl sudo \
            iperf3 socat procps ca-certificates
      - name: Install Rust (rust-toolchain.toml picks the version)
        run: |
          curl --proto '=https' -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - run: cargo build --release --locked -p mqproxy
      - name: TCP proxy benchmark (Rust, informational)
        if: github.event_name == 'push'
        continue-on-error: true
        run: bash scripts/ci_benchmarks/ci_bench_tcp_proxy.sh target/release/mqproxy
      - name: Unshaped and idle Rust benchmarks
        if: github.event_name != 'push'
        run: |
          MQPROXY_BIN=$PWD/target/release/mqproxy BENCH_LABEL=rust bash scripts/ci_benchmarks/ci_bench_unshaped.sh
          MQPROXY_BIN=$PWD/target/release/mqproxy BENCH_LABEL=rust bash scripts/ci_benchmarks/ci_bench_idle.sh
      - name: Gateway and MITM Rust benchmarks
        if: github.event_name != 'push'
        run: |
          bash scripts/ci_benchmarks/ci_bench_gateway.sh target/release/mqproxy
          bash scripts/ci_benchmarks/ci_bench_mitm.sh target/release/mqproxy
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-rust-results-${{ github.sha }}
          path: ci_bench_results/*.json
          retention-days: 90
