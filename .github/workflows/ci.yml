name: Packaging

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Retain the amd64 glibc 2.35 baseline; ARM uses a native 24.04 runner.
          - { arch: amd64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mqproxy"))')
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$VERSION" ]]; then
            echo "Tag ${GITHUB_REF_NAME#v} does not match Cargo $VERSION"; exit 1
          fi
      - name: Install build and package tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake golang dpkg-dev python3 curl iproute2
      - name: Build and verify Cargo artifacts
        run: python3 packaging/build.py
      - name: Install deb and exercise both systemd units
        run: sudo bash tests/packaging/smoke_deb.sh target/dist/mqproxy_*_${{ matrix.arch }}.deb
      - name: Rust gateway benchmark smoke (native disposable runner)
        if: github.event_name == 'push' && matrix.arch == 'amd64'
        run: sudo env REPEAT=1 DURATION=1 bash scripts/ci_benchmarks/ci_bench_gateway.sh target/release/mqproxy
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            target/dist/mqproxy_*.deb
            target/dist/mqproxy_*.tar.gz
          if-no-files-found: error
